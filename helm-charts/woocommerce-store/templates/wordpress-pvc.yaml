apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress-pvc
  labels:
    {{- include "woocommerce-store.wordpress.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.wordpress.storage.storageClass }}
  storageClassName: {{ .Values.wordpress.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage.size }}
