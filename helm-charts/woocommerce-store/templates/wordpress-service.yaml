apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress
  labels:
    {{- include "woocommerce-store.wordpress.labels" . | nindent 4 }}
spec:
  type: {{ .Values.wordpress.service.type }}
  ports:
    - port: {{ .Values.wordpress.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "woocommerce-store.wordpress.selectorLabels" . | nindent 4 }}
