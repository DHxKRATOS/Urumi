# Local development values for k3d cluster

storeName: "local-store"

ingress:
  enabled: true
  host: "local-store.localhost"
  annotations: {}
  tls:
    enabled: false

mysql:
  storage:
    size: 2Gi
    storageClass: "local-path"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

wordpress:
  storage:
    size: 5Gi
    storageClass: "local-path"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "150m"
